# Déploie le relais de mise à jour (`worker/skanfact-maj.mjs`).
#
# Jumeau de `.github/workflows/worker.yml`, qui porte le raisonnement en entier — pourquoi un
# déploiement se déclenche sur ce qui est DÉPLOYÉ et jamais sur la recette, pourquoi `--keep-vars`,
# pourquoi la version de wrangler est épinglée, et pourquoi un job vert ne suffit pas. Ce fichier ne
# redit pas ces raisons ; il les applique au second worker.
#
# Deux fichiers plutôt qu'un seul qui déploierait les deux : les deux workers changent à des moments
# différents, et un relais qui se redéploie parce qu'on a corrigé la console rendrait illisible la
# seule question qu'on se pose devant un incident — « qu'est-ce qui a bougé, et quand ? ».

name: Relais

on:
  push:
    branches: [main]
    paths:
      - 'worker/skanfact-maj.mjs'
      - 'worker/wrangler.toml'
  workflow_dispatch:

concurrency:
  group: relais-deploy
  cancel-in-progress: false

jobs:
  deployer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `route`, `fichierAutorise`, `memeSecret`, `licenceValide`, `autorise`, `origineAutorisee`,
      # `contactValide` et `releaseAdmissible` sont purs et testés par `npm test` : c'est cette
      # suite qui se tient entre une faute de frappe et les mises à jour de tous les clients.
      - name: Tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Déployer
        working-directory: worker
        run: npx --yes wrangler@4.136.2 deploy --keep-vars 2>&1 | tee /tmp/relais.log
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Un job vert ne suffit pas (9.8.1) : on redemande au relais ce qu'il SERT. Mais ce worker
      # n'a aucune route publique qui rende du contenu — c'est voulu, tout y est derrière le secret
      # de l'application. On mesure donc ce qu'un inconnu peut mesurer : le CODE DE REFUS.
      #
      # `/sante` sans secret doit répondre 403. Ce n'est pas un échec, c'est la preuve : 404 dirait
      # que la route n'existe pas (relais d'avant la 10.4.0, donc code périmé), 503 que `APP_SECRET`
      # manque. Seul 403 dit à la fois « la route est là » et « le secret est posé ».
      #
      # `OPTIONS /contact` avec une origine autorisée doit répondre 204. C'est la seule porte
      # publique du relais, celle que le site appelle, et elle se vérifie sans aucun secret.
      #
      # Le premier essai de ce contrôle exigeait 200 sur `/sante` : il a fait tomber un déploiement
      # parfaitement réussi. Un instrument qui juge sur une supposition annonce un défaut qui
      # n'existe pas — on lit la source de ce qu'on mesure avant d'écrire le seuil.
      - name: Vérifier que le relais répond
        run: |
          set -euo pipefail
          url=$(grep -oE 'https://[a-z0-9._-]+\.workers\.dev' /tmp/relais.log | head -1 || true)
          if [ -z "$url" ]; then
            echo "::warning::wrangler n'a annoncé aucune adresse workers.dev — rien n'a pu être vérifié."
            exit 0
          fi

          echo "Contrôle de $url/sante (sans secret : on attend 403)"
          s=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 --retry 3 --retry-delay 5 "$url/sante")
          echo "HTTP $s"
          case "$s" in
            403) echo "  → la route existe et APP_SECRET est posé." ;;
            404) echo "::error::/sante répond 404 : le code déployé est antérieur à la 10.4.0."; exit 1 ;;
            503) echo "::error::/sante répond 503 : APP_SECRET manque sur le worker."; exit 1 ;;
            *)   echo "::error::/sante répond $s, attendu 403."; exit 1 ;;
          esac

          echo "Contrôle de OPTIONS $url/contact (origine autorisée : on attend 204)"
          c=$(curl -s -o /dev/null -w '%{http_code}' -X OPTIONS --max-time 20 --retry 3 --retry-delay 5 \
                -H 'Origin: https://skanfact.tn' "$url/contact")
          echo "HTTP $c"
          test "$c" = "204"
          echo "Le relais sert /contact au site : le code déployé est bien celui-ci."
