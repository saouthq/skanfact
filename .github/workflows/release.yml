# Construit SkanFact pour Mac et Windows et publie une release GitHub.
# Déclenché par un tag de version (créé par `npm run release`) ou à la main
# (onglet Actions → Release → Run workflow) : la page de la release est créée à partir de la
# version de package.json, puis chaque poste y dépose ses installateurs.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

# Une publication coûte de l'argent : les machines macOS sont facturées dix fois le tarif des
# autres. Si une seconde publication est lancée pendant qu'une première tourne, la première est
# annulée au lieu d'être payée pour rien.
concurrency:
  group: release
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────────────────────────
  # La page de la release est créée ICI, une seule fois, avant que le moindre installateur ne soit
  # construit. Avant la 9.8.1, c'était electron-builder qui la créait, depuis CHACUN des deux
  # postes — et `createRelease()` ne rattrape PAS le 422 « already_exists » (contrairement à l'envoi
  # d'un fichier, qui le rattrape). Les deux postes demandaient donc la liste des releases au même
  # instant, ne trouvaient rien tous les deux, et créaient tous les deux : celui qui arrivait en
  # second échouait. La 9.8.0 est tombée exactement là-dessus.
  #
  # Ce job règle trois choses d'un coup :
  #  1. plus de course : quand les postes démarrent, la release existe et ils ne font qu'y déposer ;
  #  2. `--target` : la release est rattachée au COMMIT QU'ON CONSTRUIT. Sans lui, GitHub pose le
  #     tag sur la branche par défaut du dépôt — c'est pourquoi `v9.6.0` et `v9.8.0` désignent tous
  #     les deux un commit de la 9.4.1 : les installateurs sont justes, mais `git checkout v9.8.0`
  #     ne rend pas la source publiée ;
  #  3. le titre et les notes sont posés dès la première seconde, au lieu d'apparaître après le
  #     premier envoi de fichier — entre les deux, la page affichait le numéro de version tout seul
  #     et rien d'autre.
  # ─────────────────────────────────────────────────────────────────────────────────────────────
  preparer:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.canal.outputs.version }}
      prerelease: ${{ steps.canal.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Stable ou bêta ? C'est le NUMÉRO DE VERSION qui décide, rien d'autre : `7.26.0-beta.1` est
      # une préversion, `7.26.0` n'en est pas une. Aucune case à cocher au lancement du workflow,
      # donc aucun moyen de se tromper — et electron-builder lit exactement la même chose pour
      # nommer `beta.yml` au lieu de `latest.yml`.
      - name: Stable ou bêta
        id: canal
        shell: bash
        run: |
          V=$(node -p "require('./package.json').version")
          # `case` plutôt que `grep` : pas de commande externe, donc rien qui puisse manquer ou se
          # comporter autrement sur le poste Windows.
          case "$V" in *-*) PRE=true ;; *) PRE=false ;; esac
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRE" >> "$GITHUB_OUTPUT"
          echo "Version $V — préversion : $PRE"

      # Notes de version : la section de CHANGELOG.md qui porte cette version. Node pur, aucune
      # dépendance — ce job n'a donc pas besoin de `npm ci`.
      - run: node scripts/release-notes.js

      # `gh release create` est refusé si la release existe déjà : on regarde AVANT, et on se
      # contente alors de remettre le titre et les notes. C'est ce qui rend une reprise possible
      # après un échec, sans rien détruire de ce qui a déjà été déposé.
      - name: La page de la release
        shell: bash
        run: |
          V="${{ steps.canal.outputs.version }}"
          if [ "${{ steps.canal.outputs.prerelease }}" = "true" ]; then
            TITRE="SkanFact $V (bêta)"; PRE=--prerelease
          else
            TITRE="SkanFact $V"; PRE=
          fi
          if gh release view "v$V" > /dev/null 2>&1; then
            echo "La release v$V existe déjà — on remet le titre et les notes, on ne touche à rien d'autre."
            gh release edit "v$V" --title "$TITRE" --notes-file build/release-notes.md
          else
            echo "Création de la release v$V sur $GITHUB_SHA."
            gh release create "v$V" --target "$GITHUB_SHA" --title "$TITRE" --notes-file build/release-notes.md $PRE
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: preparer
    strategy:
      # Un échec sur un poste ne doit pas annuler l'autre. Sans ce drapeau, la panne de deux
      # secondes du poste Windows a annulé une construction macOS déjà bien avancée — la plus chère
      # des deux, et celle qu'on aurait gardée. Savoir si une panne touche un seul poste ou les deux
      # est en plus l'information qui désigne la cause (règle apprise en 5.2.3).
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Electron pèse ~250 Mo par architecture, et une construction « universal » en télécharge deux,
      # pour chacune des deux applications. Le cache épargne ce téléchargement à chaque publication :
      # sur une machine macOS facturée dix fois le tarif normal, c'est la minute la plus rentable.
      - name: Cache Electron
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-

      - run: npm ci --no-fund --no-audit

      - run: npm test

      # Les mêmes notes que celles posées sur la page : electron-builder les met dans latest.yml,
      # que l'application affiche dans Paramètres → Mises à jour.
      - run: node scripts/release-notes.js

      # UPDATE_BASE / UPDATE_SECRET : les réglages du relais de mise à jour, pris dans les secrets du
      # dépôt et posés dans le paquet. Non définis → les applications retombent sur GitHub + jeton
      # saisi à la main, comme avant. Rien de tout ça n'existe dans le code.
      # PLATEFORME_BASE / PLATEFORME_SECRET : même mécanisme pour le plan de contrôle (8.4.0). Non
      # définis → l'application ne parle à aucun serveur, et absolument rien n'en dépend.
      # shell: bash est OBLIGATOIRE ici. Sur le poste Windows, le shell par défaut est PowerShell,
      # où « $UPDATE_BASE » n'est pas la variable d'environnement mais une variable PowerShell vide :
      # l'application Windows serait construite SANS le relais, sans que rien ne le signale.
      # `releaseType=prerelease` marque la release « Pre-release » sur GitHub. C'est ce qui fait que
      # `/releases/latest` continue de pointer sur la dernière STABLE : quelqu'un qui télécharge
      # l'application à la main, ou une installation restée sur le canal normal, ne voit jamais la
      # bêta. Sans ce drapeau, publier une préversion écraserait la version « officielle » du dépôt.
      - name: Build & publish
        shell: bash
        run: npx electron-builder --publish always -c.publish.releaseType=${{ needs.preparer.outputs.prerelease == 'true' && 'prerelease' || 'release' }} -c.extraMetadata.updateBase="$UPDATE_BASE" -c.extraMetadata.updateSecret="$UPDATE_SECRET" -c.extraMetadata.plateformeBase="$PLATEFORME_BASE" -c.extraMetadata.plateformeSecret="$PLATEFORME_SECRET"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATE_BASE: ${{ secrets.UPDATE_BASE }}
          UPDATE_SECRET: ${{ secrets.UPDATE_SECRET }}
          PLATEFORME_BASE: ${{ secrets.PLATEFORME_BASE }}
          PLATEFORME_SECRET: ${{ secrets.PLATEFORME_SECRET }}
          # Pas de signature Apple pour l'instant : on désactive la notarisation.
          CSC_IDENTITY_AUTO_DISCOVERY: false
          # electron-builder REFUSE de déposer dans une release publiée il y a plus de deux heures,
          # et il le fait en ÉCRIVANT « skipped publishing » puis en sortant VERT : le job réussit,
          # la release reste vide, et personne ne le voit. Ici la release est toujours celle de la
          # version qu'on est en train de construire, et reprendre une publication après un échec
          # est précisément ce qu'on veut pouvoir faire.
          EP_GH_IGNORE_TIME: true

      # SkanFact Cabinet : seconde application du dépôt, construite depuis le même code avec un
      # autre point d'entrée. Elle se publie elle-même dans la MÊME release (même version), sur son
      # propre canal de mise à jour : cabinet.yml / cabinet-mac.yml à côté de latest.yml.
      #
      # Une bêta construit LES DEUX applications, chacune sur SON canal d'essai. Ce qui protège les
      # comptables n'est pas de sauter cette étape, c'est le canal : `build/cabinet.config.js` le
      # déduit du numéro de version, donc 9.9.0-beta.1 écrit `cabinet-beta.yml` et ne touche JAMAIS
      # `cabinet.yml`. Seul un cabinet qui a coché « Recevoir les versions d'essai » le lit, et le
      # relais laisse passer les deux noms de fichier depuis la 9.1.0.
      #
      # Jusqu'à la 9.8.4, cette étape était sautée sur une préversion. Sa raison, écrite ici, était
      # qu'une bêta « remplacerait cabinet.yml » et que les comptables « n'ont aucune case à
      # décocher » : les deux moitiés sont fausses depuis la 9.1.0, qui a donné au Cabinet son canal
      # d'essai ET sa case. Le garde-fou ne protégeait donc plus rien — il empêchait seulement de
      # faire tester au cabinet pilote la seule application sur laquelle on travaille.
      #
      # Le type de release du Cabinet se déduit du NUMÉRO DE VERSION, dans `build/cabinet.config.js`,
      # à côté de son canal et pour la même raison (7.25.0 : une seule source de vérité, écrite dans
      # le paquet, dans la release et dans le nom du fichier).
      #
      # Il a bien failli être posé ici, en ligne de commande, comme pour l'étape du dessus — et c'est
      # ce qui a fait échouer la publication de la 9.8.5 : `-c.publish.releaseType=…` écrit APRÈS un
      # `-c build/cabinet.config.js` vise la même option `-c`, le second gagne, et electron-builder
      # est parti chercher un fichier de configuration nommé « .publish.releaseType=release ».
      # L'étape du dessus n'a pas ce problème parce qu'elle ne passe aucun fichier de configuration.
      # Une commande ne porte donc JAMAIS `-c <fichier>` et `-c.<clé>=<valeur>` ensemble ; ce qui doit
      # varier va dans le fichier, où c'est une donnée et non une collision d'arguments.
      - name: Build & publish SkanFact Cabinet
        run: npx electron-builder -c build/cabinet.config.js --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATE_BASE: ${{ secrets.UPDATE_BASE }}
          UPDATE_SECRET: ${{ secrets.UPDATE_SECRET }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
          EP_GH_IGNORE_TIME: true
