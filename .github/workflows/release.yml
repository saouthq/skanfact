# Construit SkanFact pour Mac et Windows et publie une release GitHub.
# Déclenché par un tag de version (créé par `npm run release`) ou à la main
# (onglet Actions → Release → Run workflow) : electron-builder crée alors la release
# et le tag à partir de la version de package.json.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

# Une publication coûte de l'argent : les machines macOS sont facturées dix fois le tarif des
# autres. Si une seconde publication est lancée pendant qu'une première tourne, la première est
# annulée au lieu d'être payée pour rien.
concurrency:
  group: release
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Electron pèse ~250 Mo par architecture, et une construction « universal » en télécharge deux,
      # pour chacune des deux applications. Le cache épargne ce téléchargement à chaque publication :
      # sur une machine macOS facturée dix fois le tarif normal, c'est la minute la plus rentable.
      - name: Cache Electron
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-

      - run: npm ci --no-fund --no-audit

      - run: npm test

      # Notes de version (section CHANGELOG.md de cette version) → latest.yml + page de la release
      - run: node scripts/release-notes.js

      # Stable ou bêta ? C'est le NUMÉRO DE VERSION qui décide, rien d'autre : `7.26.0-beta.1` est
      # une préversion, `7.26.0` n'en est pas une. Aucune case à cocher au lancement du workflow,
      # donc aucun moyen de se tromper — et electron-builder lit exactement la même chose pour
      # nommer `beta.yml` au lieu de `latest.yml`.
      - name: Stable ou bêta
        id: canal
        shell: bash
        run: |
          V=$(node -p "require('./package.json').version")
          # `case` plutôt que `grep` : pas de commande externe, donc rien qui puisse manquer ou se
          # comporter autrement sur le poste Windows.
          case "$V" in *-*) PRE=true ;; *) PRE=false ;; esac
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRE" >> "$GITHUB_OUTPUT"
          echo "Version $V — préversion : $PRE"

      # UPDATE_BASE / UPDATE_SECRET : les réglages du relais de mise à jour, pris dans les secrets du
      # dépôt et posés dans le paquet. Non définis → les applications retombent sur GitHub + jeton
      # saisi à la main, comme avant. Rien de tout ça n'existe dans le code.
      # PLATEFORME_BASE / PLATEFORME_SECRET : même mécanisme pour le plan de contrôle (8.4.0). Non
      # définis → l'application ne parle à aucun serveur, et absolument rien n'en dépend.
      # shell: bash est OBLIGATOIRE ici. Sur le poste Windows, le shell par défaut est PowerShell,
      # où « $UPDATE_BASE » n'est pas la variable d'environnement mais une variable PowerShell vide :
      # l'application Windows serait construite SANS le relais, sans que rien ne le signale.
      # `releaseType=prerelease` marque la release « Pre-release » sur GitHub. C'est ce qui fait que
      # `/releases/latest` continue de pointer sur la dernière STABLE : quelqu'un qui télécharge
      # l'application à la main, ou une installation restée sur le canal normal, ne voit jamais la
      # bêta. Sans ce drapeau, publier une préversion écraserait la version « officielle » du dépôt.
      - name: Build & publish
        shell: bash
        run: npx electron-builder --publish always -c.publish.releaseType=${{ steps.canal.outputs.prerelease == 'true' && 'prerelease' || 'release' }} -c.extraMetadata.updateBase="$UPDATE_BASE" -c.extraMetadata.updateSecret="$UPDATE_SECRET" -c.extraMetadata.plateformeBase="$PLATEFORME_BASE" -c.extraMetadata.plateformeSecret="$PLATEFORME_SECRET"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATE_BASE: ${{ secrets.UPDATE_BASE }}
          UPDATE_SECRET: ${{ secrets.UPDATE_SECRET }}
          PLATEFORME_BASE: ${{ secrets.PLATEFORME_BASE }}
          PLATEFORME_SECRET: ${{ secrets.PLATEFORME_SECRET }}
          # Pas de signature Apple pour l'instant : on désactive la notarisation.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # Le titre et les notes se posent sur les DEUX postes, pas seulement sur le Mac. La page de la
      # release existe dès le premier fichier envoyé — c'est-à-dire dès que le poste Windows a fini,
      # deux minutes avant le Mac, dont la construction « universal » compile deux architectures.
      # Tant que cette étape n'a pas tourné, la page affiche le titre par défaut d'electron-builder
      # (le numéro de version tout seul) et pas de notes : quelqu'un qui regarde à ce moment-là voit
      # une release qui a l'air bâclée. Les deux postes écrivent exactement la même chose, donc
      # celui qui arrive en second ne fait que réécrire à l'identique — et si l'un des deux échoue,
      # les notes sont quand même posées par l'autre.
      - name: Release notes on GitHub
        shell: bash
        run: |
          V="${{ steps.canal.outputs.version }}"
          if [ "${{ steps.canal.outputs.prerelease }}" = "true" ]; then T="SkanFact $V (bêta)"; else T="SkanFact $V"; fi
          gh release edit "v$V" --title "$T" --notes-file build/release-notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # SkanFact Cabinet : seconde application du dépôt, construite depuis le même code avec un
      # autre point d'entrée. Elle se publie elle-même dans la MÊME release (même version), sur son
      # propre canal de mise à jour : cabinet.yml / cabinet-mac.yml à côté de latest.yml.
      #
      # Une bêta ne concerne QUE l'application entreprise. La construire aussi côté cabinet
      # remplacerait `cabinet.yml` par une préversion, et tous les comptables — qui n'ont rien
      # demandé et n'ont aucune case à décocher — se verraient proposer une version d'essai.
      - name: Build & publish SkanFact Cabinet
        if: steps.canal.outputs.prerelease != 'true'
        run: npx electron-builder -c build/cabinet.config.js --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATE_BASE: ${{ secrets.UPDATE_BASE }}
          UPDATE_SECRET: ${{ secrets.UPDATE_SECRET }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
