# Construit SkanFact pour Mac et Windows et publie une release GitHub.
# Déclenché par un tag de version (créé par `npm run release`) ou à la main
# (onglet Actions → Release → Run workflow) : electron-builder crée alors la release
# et le tag à partir de la version de package.json.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-fund --no-audit

      - run: npm test

      # Notes de version (section CHANGELOG.md de cette version) → latest.yml + page de la release
      - run: node scripts/release-notes.js

      - name: Build & publish
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pas de signature Apple pour l'instant : on désactive la notarisation.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Release notes on GitHub
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          V=$(node -p "require('./package.json').version")
          gh release edit "v$V" --title "SkanFact $V" --notes-file build/release-notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # SkanFact Cabinet : seconde application du dépôt, construite depuis le même code avec un autre
      # point d'entrée. Elle n'a pas de mise à jour automatique (pas de latest.yml, donc `--publish
      # never`) : ses installeurs sont simplement attachés à la release de l'app entreprise.
      - name: Build SkanFact Cabinet
        run: npx electron-builder -c build/cabinet.config.js --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # Un fichier à la fois, avec une reprise : un téléversement de 200 Mo qui se coupe ne doit pas
      # faire échouer toute la release (« ReleaseAsset.name already exists » après une coupure).
      - name: Attach Cabinet installers
        shell: bash
        run: |
          V=$(node -p "require('./package.json').version")
          for f in $(ls dist-cabinet/SkanFact-Cabinet-*.dmg dist-cabinet/SkanFact-Cabinet-*.exe 2>/dev/null); do
            for try in 1 2 3; do
              if gh release upload "v$V" "$f" --clobber; then echo "envoyé : $f"; break; fi
              echo "échec du téléversement de $f (essai $try) — nouvelle tentative"
              sleep $((try * 15))
              if [ "$try" = "3" ]; then exit 1; fi
            done
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
